<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ship Deck</title>
        <style>
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #0d0f12;
            }

            #app {
                display: block;
                width: 100%;
                height: 100%;
                background: #0d0f12;
            }
        </style>
      <script type="module" crossorigin src="./assets/index-DAm6v3n3.js"></script>
      <link rel="stylesheet" crossorigin href="./assets/index-CbJRXJpv.css">
    </head>
    <body>
        <canvas id="app"></canvas>
        <div id="loader" role="status" aria-live="polite">
            <div class="loader-mark" aria-hidden="true"></div>
            <div class="loader-copy">
                <div class="loader-title">Loading splat</div>
                <div id="loader-message" class="loader-message">Preparing scene...</div>
                <div class="loader-progress" aria-hidden="true">
                    <div id="loader-progress-bar"></div>
                </div>
            </div>
        </div>
        <div id="controls" aria-label="Navigation controls">
            <div class="control-primary">
                <div class="key-grid" aria-hidden="true">
                    <span></span>
                    <kbd>W</kbd>
                    <span></span>
                    <kbd>A</kbd>
                    <kbd>S</kbd>
                    <kbd>D</kbd>
                </div>
                <div class="control-primary-copy">
                    <span class="control-action">Move</span>
                    <span class="control-detail">WASD or arrows</span>
                </div>
            </div>
            <div class="control-list">
                <div class="control-row">
                    <span class="control-shortcut">
                        <kbd>Q</kbd>
                        <kbd>E</kbd>
                    </span>
                    <span class="control-label">Down / up</span>
                </div>
                <div class="control-row">
                    <span class="control-token">Mouse</span>
                    <span class="control-label">Look (click to capture)</span>
                </div>
                <div class="control-row">
                    <span class="control-token">Shift</span>
                    <span class="control-label">Sprint</span>
                </div>
                <div class="control-row">
                    <span class="control-token">R</span>
                    <span class="control-label">Reset view</span>
                </div>
            </div>
        </div>
        <div id="spawn-picker" aria-label="Spawn point picker">
            <div class="spawn-picker-head">
                <span class="spawn-picker-title">Spawn point</span>
                <span class="spawn-picker-space">splat-local</span>
            </div>
            <div class="spawn-picker-values">
                <span class="spawn-picker-axis">X</span>
                <output id="spawn-x">0.00</output>
                <span class="spawn-picker-axis">Y</span>
                <output id="spawn-y">0.00</output>
                <span class="spawn-picker-axis">Z</span>
                <output id="spawn-z">0.00</output>
            </div>
            <div class="spawn-picker-actions">
                <button id="spawn-copy" type="button">Copy X/Y/Z</button>
                <span class="spawn-picker-hint">Camera position. Fly to the deck, then copy.</span>
            </div>
        </div>
        <div id="crosshair" aria-hidden="true"></div>
    </body>
</html>
